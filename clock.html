<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏甫企業社打卡系統</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f8f9fa; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 420px; margin: 20px auto; }
        .info-box { font-size: 18px; margin-bottom: 20px; padding: 10px; background-color: #e9ecef; border-radius: 4px; font-weight: bold; color: #495057; }
        .form-group { margin-bottom: 20px; }
        select { padding: 12px; font-size: 16px; width: 100%; max-width: 250px; border-radius: 4px; border: 1px solid #ced4da; background-color: #e9ecef; }
        button { padding: 14px 28px; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; max-width: 250px; margin-top: 10px; }
        .btn-clock { background-color: #28a745; color: white; }
        .btn-clock:hover { background-color: #218838; }
        .btn-clock:disabled { background-color: #6c757d; cursor: not-allowed; }
        .btn-history { background-color: #007bff; color: white; }
        .btn-history:hover { background-color: #0056b3; }
        
        #msg { margin-top: 15px; font-weight: bold; color: #333; font-size: 15px; line-height: 1.5; }

        /* 📋 個人當月紀錄卡片樣式 */
        .history-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 420px; margin: 20px auto; text-align: left; display: none; }
        .history-title { font-weight: bold; font-size: 16px; color: #495057; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .history-list { list-style: none; padding: 0; margin: 0; font-size: 13px; color: #333; max-height: 350px; overflow-y: auto; }
        .history-item { padding: 10px 0; border-bottom: 1px solid #eee; }
        .history-item:last-child { border-bottom: none; }
        .tag-work { background-color: #28a745; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .tag-off { background-color: #17a2b8; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .close-btn { background-color: #6c757d; color: white; font-size: 12px; padding: 4px 8px; width: auto; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>🏢 宏甫企業社打卡系統</h2>
        
        <div class="info-box" id="identityDisplay">正在識別身分...</div>
        <input type="hidden" id="empIdInput">

        <div class="form-group">
            <select id="actionSelect" disabled>
                <option value="上班">☀️ 上班打卡 (06:00-13:00)</option>
                <option value="下班">🌙 下班打卡 (13:01-05:59)</option>
            </select>
        </div>

        <button class="btn-clock" id="clockInBtn" disabled>確認打卡（獲取 GPS）</button>
        
        <!-- 💡 新增獨立的調閱紀錄按鈕 -->
        <button class="btn-history" id="toggleHistoryBtn" style="display: none;" onclick="toggleHistory()">📅 調閱當月打卡紀錄</button>
        
        <p id="msg">讀取網址參數中...</p>
    </div>

    <!-- 📋 當月紀錄區塊（預設隱藏） -->
    <div class="history-card" id="historyBox">
        <div class="history-title">
            <span id="historyTitleText">📅 本月打卡紀錄</span>
            <button class="close-btn" onclick="toggleHistory(false)">✕ 關閉</button>
        </div>
        <ul class="history-list" id="historyList">
            <li class="history-item">點擊下方按鈕載入紀錄...</li>
        </ul>
    </div>

    <script>
    var finalEmpId = "";
    var gasUrl = "https://script.google.com/macros/s/AKfycbwBE0ecmn4G_yAAgVfy_SS97YTmPa2OM94nhxUOzWagVx_JpkaSZvWRAFEzHkoDrySW6w/exec";
    var isHistoryLoaded = false;

    function generateUUID() {
        return 'dev-' + Math.random().toString(36).substring(2, 15) + '-' + Math.random().toString(36).substring(2, 15);
    }

    function autoDetectAction() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes();
        var timeValue = hours * 100 + minutes;

        var actionSelect = document.getElementById('actionSelect');
        if (timeValue >= 600 && timeValue <= 1300) {
            actionSelect.value = "上班";
            return "上班";
        } else {
            actionSelect.value = "下班";
            return "下班";
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        var msgDiv = document.getElementById('msg');
        var identityDisplay = document.getElementById('identityDisplay');
        var clockInBtn = document.getElementById('clockInBtn');
        var toggleHistoryBtn = document.getElementById('toggleHistoryBtn');

        const urlParams = new URLSearchParams(window.location.search);
        var empIdFromUrl = urlParams.get('id');
        if (empIdFromUrl) empIdFromUrl = empIdFromUrl.trim();

        var savedUUID = localStorage.getItem("company_device_uuid");
        var deviceBoundId = localStorage.getItem("device_bound_emp_id");
        var isUrlCleanRequested = urlParams.get('clean') === 'yes';
        
        var currentAction = autoDetectAction();

        if (empIdFromUrl && empIdFromUrl !== "") {
            if (deviceBoundId && deviceBoundId !== empIdFromUrl && !isUrlCleanRequested) {
                identityDisplay.innerText = "❌ 警告：裝置衝突";
                identityDisplay.style.color = "red";
                msgDiv.innerText = "偵測到異常代打卡行為！\n此設備已綁定為【" + deviceBoundId + "】專用。";
                msgDiv.style.color = "red";
                clockInBtn.disabled = true;

                sendPostToGAS(deviceBoundId, "🚨 代打卡警告", "", "", "裝置序號[" + savedUUID + "] 持有者【" + deviceBoundId + "】試圖幫【" + empIdFromUrl + "】代打卡！");
                return;
            }

            if (!deviceBoundId || isUrlCleanRequested) {
                savedUUID = generateUUID();
                localStorage.setItem("company_device_uuid", savedUUID);
                localStorage.setItem("device_bound_emp_id", empIdFromUrl);
            }

            finalEmpId = empIdFromUrl;
            document.getElementById('empIdInput').value = finalEmpId;
            identityDisplay.innerText = "👤 當前員工： " + finalEmpId;
            identityDisplay.style.color = "#007bff";

        } else {
            if (deviceBoundId) {
                finalEmpId = deviceBoundId;
                document.getElementById('empIdInput').value = finalEmpId;
                identityDisplay.innerText = "👤 當前員工： " + finalEmpId;
                identityDisplay.style.color = "#007bff";
            } else {
                identityDisplay.innerText = "⚠️ 未識別身分";
                identityDisplay.style.color = "red";
                msgDiv.innerText = "❌ 錯誤：此裝置未授權綁定身分。\n請掃描您的個人專屬 QR Code！";
                msgDiv.style.color = "red";
                clockInBtn.disabled = true; 
                return;
            }
        }

        msgDiv.innerText = "已根據時間自動為您選擇【" + currentAction + "】。";
        msgDiv.style.color = "#333";
        clockInBtn.disabled = false;
        
        // 顯示調閱紀錄按鈕（但不自動發送請求）
        if (finalEmpId) {
            toggleHistoryBtn.style.display = 'block';
        }
    });

    // 💡 切換與請求「當月紀錄」
    function toggleHistory(forceState) {
        var historyBox = document.getElementById('historyBox');
        
        if (forceState === false) {
            historyBox.style.display = 'none';
            return;
        }

        if (historyBox.style.display === 'none' || historyBox.style.display === '') {
            historyBox.style.display = 'block';
            fetchMyHistory(); // 展開時才發送 API 請求
        } else {
            historyBox.style.display = 'none';
        }
    }

    // 💡 僅在使用者按下按鈕時發送 API 請求
    function fetchMyHistory() {
        var historyList = document.getElementById('historyList');
        var historyTitleText = document.getElementById('historyTitleText');
        historyList.innerHTML = '<li class="history-item" style="color:#666;">🔄 讀取當月紀錄中...</li>';

        fetch(gasUrl + "?emp_id=" + encodeURIComponent(finalEmpId))
            .then(res => res.json())
            .then(res => {
                if (res.status === "success" && res.data.length > 0) {
                    historyTitleText.innerText = "📅 " + res.month + "打卡紀錄 (共 " + res.data.length + " 筆)";
                    var html = "";
                    res.data.forEach(function(item) {
                        var tagClass = item.action === "上班" ? "tag-work" : "tag-off";
                        html += '<li class="history-item">' +
                                '<div><span class="' + tagClass + '">' + item.action + '</span> <strong>' + item.time + '</strong></div>' +
                                '<div style="color:#666; font-size:12px; margin-top:3px;">📍 ' + (item.address || "無位置紀錄") + '</div>' +
                                '</li>';
                    });
                    historyList.innerHTML = html;
                } else {
                    historyTitleText.innerText = "📅 本月打卡紀錄";
                    historyList.innerHTML = '<li class="history-item" style="color:#888;">本月尚無任何打卡紀錄。</li>';
                }
            })
            .catch(err => {
                historyList.innerHTML = '<li class="history-item" style="color:red;">❌ 紀錄載入失敗</li>';
            });
    }

    var btnElement = document.getElementById('clockInBtn');
    if (btnElement) {
        btnElement.addEventListener('click', function() {
            var msgDiv = document.getElementById('msg');
            var action = autoDetectAction();
            var currentUUID = localStorage.getItem("company_device_uuid") || "未知序號";

            msgDiv.innerText = "🔄 正在請求 GPS 定位權限並定位中...";
            msgDiv.style.color = "#333";
            btnElement.disabled = true;

            if (!navigator.geolocation) {
                msgDiv.innerText = "❌ 瀏覽器不支援 GPS 定位。";
                msgDiv.style.color = "red";
                btnElement.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var myLat = position.coords.latitude;
                    var myLng = position.coords.longitude;
                    
                    sendPostToGAS(finalEmpId, action, myLat, myLng, currentUUID);
                    
                    msgDiv.innerText = "🎉 " + action + "打卡成功！資料已傳送。";
                    msgDiv.style.color = "#28a745";
                    
                    setTimeout(function() { 
                        btnElement.disabled = false; 
                    }, 2000);
                },
                function(geoError) {
                    msgDiv.innerText = "⚠️ 定位失敗，已送出無 GPS 紀錄打卡。";
                    msgDiv.style.color = "#d9534f";
                    sendPostToGAS(finalEmpId, action, "", "", currentUUID);
                    
                    setTimeout(function() { 
                        btnElement.disabled = false; 
                    }, 2000);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    function sendPostToGAS(empId, action, lat, lng, uuid) {
        var payload = { 
            "emp_id": empId, 
            "action": action, 
            "latitude": lat, 
            "longitude": lng,
            "device_uuid": uuid 
        };
        
        fetch(gasUrl, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(function(err) {
            console.error("傳送失敗:", err);
        });
    }
    </script>
</body>
</html>
