<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏甫企業社打卡系統</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f8f9fa; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 50px auto; }
        .info-box { font-size: 18px; margin-bottom: 20px; padding: 10px; background-color: #e9ecef; border-radius: 4px; font-weight: bold; color: #495057; }
        .form-group { margin-bottom: 20px; }
        select { padding: 12px; font-size: 16px; width: 100%; max-width: 250px; border-radius: 4px; border: 1px solid #ced4da; }
        button { padding: 14px 28px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; max-width: 250px; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        #msg { margin-top: 20px; font-weight: bold; color: #333; font-size: 15px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>🏢 宏甫企業社打卡系統</h2>
        
        <!-- 核心畫面標籤 -->
        正在識別身分...</div>
        <input type="hidden" id="empIdInput">

        <div class="form-group">
            <select id="actionSelect">
                <option value="上班">☀️ 上班打卡</option>
                <option value="下班">🌙 下班打卡</option>
            </select>
        </div>

        <button id="clockInBtn" disabled>確認打卡（獲取 GPS）</button>
        <p id="msg">讀取網址參數中...</p>
    </div>

    <script>
    var finalEmpId = "";

    document.addEventListener("DOMContentLoaded", function() {
        // 💡 終極防呆：如果 HTML 標籤不小心被編輯器吞了，程式碼會自動在畫面上「無中生有」重建它們！
        var card = document.getElementById('mainCard');
        if (!card) {
            // 連 card 都不見了，直接用程式硬生一個外殼
            card = document.createElement('div');
            card.id = 'mainCard';
            card.className = 'card';
            document.body.appendChild(card);
        }

        if (!document.getElementById('identityDisplay')) {
            var newDiv = document.createElement('div');
            newDiv.className = 'info-box';
            newDiv.id = 'identityDisplay';
            newDiv.innerText = '正在識別身分...';
            card.insertBefore(newDiv, card.firstChild);
        }

        if (!document.getElementById('empIdInput')) {
            var newInput = document.createElement('input');
            newInput.type = 'hidden';
            newInput.id = 'empIdInput';
            document.body.appendChild(newInput);
        }

        if (!document.getElementById('msg')) {
            var newP = document.createElement('p');
            newP.id = 'msg';
            newP.innerText = '讀取網址參數中...';
            card.appendChild(newP);
        }

        // 安全抓取元件，即便還是 null 也不會閃退當掉
        var msgDiv = document.getElementById('msg') || { set innerText(v){} };
        var identityDisplay = document.getElementById('identityDisplay') || { set innerText(v){} };
        var clockInBtn = document.getElementById('clockInBtn') || { set disabled(v){} };

        // 解析網址上的參數
        const urlParams = new URLSearchParams(window.location.search);
        var empIdFromUrl = urlParams.get('id');
        if (empIdFromUrl) empIdFromUrl = empIdFromUrl.trim();

        // 設備雙重鎖定核心防線
        var deviceBoundId = localStorage.getItem("device_bound_emp_id");

        if (empIdFromUrl && empIdFromUrl !== "") {
            
            if (deviceBoundId && deviceBoundId !== empIdFromUrl) {
                // 🚨 抓到作弊！鎖死按鈕
                identityDisplay.innerText = "❌ 警告：裝置衝突";
                if(identityDisplay.style) identityDisplay.style.color = "red";
                msgDiv.innerText = "偵測到異常代打卡行為！\n此手機已綁定為【" + deviceBoundId + "】專用。\n無法使用【" + empIdFromUrl + "】的連結進行打卡！";
                if(msgDiv.style) msgDiv.style.color = "red";
                clockInBtn.disabled = true;

                // 🎯【背景自動抓包通報】一開網頁直接傳回 Google 試算表紀錄
                sendPostToGAS(
                    deviceBoundId, 
                    "🚨 代打卡警告", 
                    "不支援", 
                    "裝置持有者【" + deviceBoundId + "】試圖幫【" + empIdFromUrl + "】代打卡！"
                );
                return;
            }

            // 第一次使用，鎖定設備
            if (!deviceBoundId) {
                localStorage.setItem("device_bound_emp_id", empIdFromUrl);
            }

            finalEmpId = empIdFromUrl;
            var empInput = document.getElementById('empIdInput');
            if (empInput) empInput.value = finalEmpId;
            
            identityDisplay.innerText = "👤 當前員工： " + finalEmpId;
            if(identityDisplay.style) identityDisplay.style.color = "#007bff";
            msgDiv.innerText = "身分安全認證成功，請進行打卡。";
            clockInBtn.disabled = false; 

        } else {
            // 網址沒帶參數，但手機曾經綁定過，自動幫他帶入
            if (deviceBoundId) {
                finalEmpId = deviceBoundId;
                var empInput = document.getElementById('empIdInput');
                if (empInput) empInput.value = finalEmpId;
                identityDisplay.innerText = "👤 當前員工： " + finalEmpId;
                if(identityDisplay.style) identityDisplay.style.color = "#007bff";
                msgDiv.innerText = "已自動識別此手機綁定身分，請進行打卡。";
                clockInBtn.disabled = false;
            } else {
                identityDisplay.innerText = "⚠️ 未識別身分";
                if(identityDisplay.style) identityDisplay.style.color = "red";
                msgDiv.innerText = "❌ 錯誤：網址無效且此裝置未綁定身分。\n請掃描您的個人專屬 QR Code！";
                if(msgDiv.style) msgDiv.style.color = "red";
                clockInBtn.disabled = true; 
            }
        }
    });

    // 正常打卡按鈕點擊事件
    var btnElement = document.getElementById('clockInBtn');
    if (btnElement) {
        btnElement.addEventListener('click', function() {
            var msgDiv = document.getElementById('msg') || { set innerText(v){} };
            var actionSelect = document.getElementById('actionSelect');
            var action = actionSelect ? actionSelect.value : "上班";
            
            msgDiv.innerText = "🔄 正在請求 GPS 定位權限並定位中...";

            if (!navigator.geolocation) {
                msgDiv.innerText = "❌ 瀏覽器不支援 GPS。";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var myLat = position.coords.latitude;
                    var myLng = position.coords.longitude;
                    msgDiv.innerText = "✅ 定位成功！正在傳送打卡資料...";
                    sendPostToGAS(finalEmpId, action, myLat, myLng);
                },
                function(geoError) {
                    msgDiv.innerText = "❌ 定位失敗，請開啟手機 GPS";
                    sendPostToGAS(finalEmpId, action, "", ""); 
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    // 發送資料給 Google Apps Script 後台的通用函式
    function sendPostToGAS(empId, action, lat, lng) {
        var gasUrl = "https://script.google.com/macros/s/AKfycbwBE0ecmn4G_yAAgVfy_SS97YTmPa2OM94nhxUOzWagVx_JpkaSZvWRAFEzHkoDrySW6w/exec";
        var payload = { "emp_id": empId, "action": action, "latitude": lat, "longitude": lng };
        
        fetch(gasUrl, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
    }
    </script>
</body>
</html>
