<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏甫企業社打卡系統</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f8f9fa; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 50px auto; }
        .info-box { font-size: 18px; margin-bottom: 20px; padding: 10px; background-color: #e9ecef; border-radius: 4px; font-weight: bold; color: #495057; }
        .form-group { margin-bottom: 20px; }
        select { padding: 12px; font-size: 16px; width: 100%; max-width: 250px; border-radius: 4px; border: 1px solid #ced4da; background-color: #e9ecef; }
        button { padding: 14px 28px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; max-width: 250px; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        #msg { margin-top: 20px; font-weight: bold; color: #333; font-size: 15px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>🏢 宏甫企業社打卡系統</h2>
        
        <div class="info-box" id="identityDisplay">正在識別身分...</div>
        <input type="hidden" id="empIdInput">

        <div class="form-group">
            <select id="actionSelect" disabled>
                <option value="上班">☀️ 上班打卡 (06:00-13:00)</option>
                <option value="下班">🌙 下班打卡 (13:01-05:59)</option>
            </select>
        </div>

        <button id="clockInBtn" disabled>確認打卡（獲取 GPS）</button>
        <p id="msg">讀取網址參數中...</p>
    </div>

    <script>
    var finalEmpId = "";

    function generateUUID() {
        return 'dev-' + Math.random().toString(36).substring(2, 15) + '-' + Math.random().toString(36).substring(2, 15);
    }

    // 💡 自動判定：06:00~13:00 為上班，其餘時間 (13:01~05:59) 全數為下班
    function autoDetectAction() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes();
        var timeValue = hours * 100 + minutes; // 格式化時間數字 (如 06:30 -> 630, 13:01 -> 1301)

        var actionSelect = document.getElementById('actionSelect');
        
        if (timeValue >= 600 && timeValue <= 1300) {
            actionSelect.value = "上班";
            return "上班";
        } else {
            actionSelect.value = "下班";
            return "下班";
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        var msgDiv = document.getElementById('msg');
        var identityDisplay = document.getElementById('identityDisplay');
        var clockInBtn = document.getElementById('clockInBtn');

        const urlParams = new URLSearchParams(window.location.search);
        var empIdFromUrl = urlParams.get('id');
        if (empIdFromUrl) empIdFromUrl = empIdFromUrl.trim();

        var savedUUID = localStorage.getItem("company_device_uuid");
        var deviceBoundId = localStorage.getItem("device_bound_emp_id");
        var isUrlCleanRequested = urlParams.get('clean') === 'yes';
        
        var currentAction = autoDetectAction();

        if (empIdFromUrl && empIdFromUrl !== "") {
            if (deviceBoundId && deviceBoundId !== empIdFromUrl && !isUrlCleanRequested) {
                identityDisplay.innerText = "❌ 警告：裝置衝突";
                identityDisplay.style.color = "red";
                msgDiv.innerText = "偵測到異常代打卡行為！\n此設備已綁定為【" + deviceBoundId + "】專用。";
                msgDiv.style.color = "red";
                clockInBtn.disabled = true;

                sendPostToGAS(deviceBoundId, "🚨 代打卡警告", "", "", "裝置序號[" + savedUUID + "] 持有者【" + deviceBoundId + "】試圖幫【" + empIdFromUrl + "】代打卡！");
                return;
            }

            if (!deviceBoundId || isUrlCleanRequested) {
                savedUUID = generateUUID();
                localStorage.setItem("company_device_uuid", savedUUID);
                localStorage.setItem("device_bound_emp_id", empIdFromUrl);
            }

            finalEmpId = empIdFromUrl;
            document.getElementById('empIdInput').value = finalEmpId;
            identityDisplay.innerText = "👤 當前員工： " + finalEmpId;
            identityDisplay.style.color = "#007bff";

        } else {
            if (deviceBoundId) {
                finalEmpId = deviceBoundId;
                document.getElementById('empIdInput').value = finalEmpId;
                identityDisplay.innerText = "👤 當前員工： " + finalEmpId;
                identityDisplay.style.color = "#007bff";
            } else {
                identityDisplay.innerText = "⚠️ 未識別身分";
                identityDisplay.style.color = "red";
                msgDiv.innerText = "❌ 錯誤：此裝置未授權綁定身分。\n請掃描您的個人專屬 QR Code！";
                msgDiv.style.color = "red";
                clockInBtn.disabled = true; 
                return;
            }
        }

        msgDiv.innerText = "已根據時間自動為您選擇【" + currentAction + "】。";
        msgDiv.style.color = "#333";
        clockInBtn.disabled = false;
    });

    var btnElement = document.getElementById('clockInBtn');
    if (btnElement) {
        btnElement.addEventListener('click', function() {
            var msgDiv = document.getElementById('msg');
            var action = autoDetectAction(); // 按下按鈕時重新判定一次
            var currentUUID = localStorage.getItem("company_device_uuid") || "未知序號";

            msgDiv.innerText = "🔄 正在請求 GPS 定位權限並定位中...";
            msgDiv.style.color = "#333";
            btnElement.disabled = true;

            if (!navigator.geolocation) {
                msgDiv.innerText = "❌ 瀏覽器不支援 GPS 定位。";
                msgDiv.style.color = "red";
                btnElement.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var myLat = position.coords.latitude;
                    var myLng = position.coords.longitude;
                    
                    sendPostToGAS(finalEmpId, action, myLat, myLng, currentUUID);
                    
                    msgDiv.innerText = "🎉 " + action + "打卡成功！資料已傳送。";
                    msgDiv.style.color = "#28a745";
                    setTimeout(function() { btnElement.disabled = false; }, 3000);
                },
                function(geoError) {
                    msgDiv.innerText = "⚠️ 定位失敗，已送出無 GPS 紀錄打卡。";
                    msgDiv.style.color = "#d9534f";
                    sendPostToGAS(finalEmpId, action, "", "", currentUUID);
                    setTimeout(function() { btnElement.disabled = false; }, 3000);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    function sendPostToGAS(empId, action, lat, lng, uuid) {
        var gasUrl = "https://script.google.com/macros/s/AKfycbwBE0ecmn4G_yAAgVfy_SS97YTmPa2OM94nhxUOzWagVx_JpkaSZvWRAFEzHkoDrySW6w/exec";
        
        var payload = { 
            "emp_id": empId, 
            "action": action, 
            "latitude": lat, 
            "longitude": lng,
            "device_uuid": uuid 
        };
        
        fetch(gasUrl, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(function(err) {
            console.error("傳送失敗:", err);
        });
    }
    </script>
</body>
</html>
